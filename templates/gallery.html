<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Nube de Cacao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-cream);
        }

        .navbar-custom {
            background: rgba(44, 24, 16, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }

        .navbar-brand {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--gold-primary) !important;
        }

        .nav-link {
            color: #E6E0D4 !important;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--gold-primary) !important;
        }

        .hero-section {
            background: linear-gradient(135deg, var(--coffee-dark), #3a2820);
            color: white;
            padding: 120px 0;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 3.5rem;
            font-weight: 800;
        }

        .gallery-grid {
            padding: 100px 0;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            aspect-ratio: 1;
            cursor: pointer;
            group: 'gallery';
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item .overlay {
            position: absolute;
            inset: 0;
            background: rgba(44, 24, 16, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .overlay-icon {
            color: var(--gold-primary);
            font-size: 3rem;
        }

        .footer-custom {
            background: var(--coffee-dark);
            color: white;
            padding: 60px 0 20px;
            text-align: center;
            margin-top: 80px;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--coffee-dark);
            margin-bottom: 70px;
            position: relative;
        }

        .section-title::after {
            content: '';
            width: 70px;
            height: 3px;
            background: var(--gold-primary);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('ndc_home') }}">
                <i class="fa-solid fa-leaf me-2"></i> Nube de Cacao
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('ndc_home') }}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('menu') }}">Menú</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('gallery') }}">Galería</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('reservation') }}">Reservación</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('contact') }}">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Cerrar Sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero-section">
        <div class="container">
            <h1>Nuestra Galería</h1>
            <p>Momentos especiales en Nube de Cacao</p>
        </div>
    </section>

    <!-- Gallery -->
    <section class="gallery-grid">
        <div class="container">
            <h2 class="section-title">Nuestro Espacio</h2>
            
            <div class="row g-4">
                {% for i in range(1, 9) %}
                <div class="col-md-6 col-lg-3">
                    <div class="gallery-item">
                        <img src="{{ url_for('static', filename='images/gallery_' + i|string + '.jpeg') }}" alt="Galería">
                        <div class="overlay">
                            <div class="overlay-icon">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-custom">
        <div class="container">
            <p>&copy; 2026 Nube de Cacao. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
