<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registrar Venta | Nube de Cacao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <!-- Background Clouds -->
    <div class="clouds-container">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="cloud cloud-4"></div>
        <div class="cloud cloud-5"></div>
        <div class="cloud cloud-6"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-premium py-3 mb-5">
        <div class="container">
            <a href="/dashboard" class="text-decoration-none text-white d-flex align-items-center">
                <div class="btn btn-outline-light rounded-circle d-flex align-items-center justify-content-center me-2"
                    style="width: 35px; height: 35px;">
                    <i class="fa-solid fa-arrow-left"></i>
                </div>
                <span class="fw-bold">Volver al Panel</span>
            </a>
            <span class="navbar-brand ms-auto fw-bold" style="letter-spacing: 1px;">
                <i class="fa-solid fa-mug-hot me-2"></i> Nube de Cacao
            </span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container d-flex justify-content-center align-items-center"
        style="min-height: 70vh; position: relative; z-index: 10;">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-lg overflow-hidden" style="border-radius: 20px;">
                <div class="card-header bg-white border-0 text-center pt-4 pb-0">
                    <div class="d-inline-block p-3 rounded-circle mb-2" style="background-color: var(--bg-cream);">
                        <i class="fa-solid fa-cash-register fa-2x" style="color: var(--gold-primary);"></i>
                    </div>
                    <h3 class="fw-bold mb-1" style="color: var(--coffee-dark);">Nueva Venta</h3>
                    <p class="text-muted small">Registrar una nueva orden</p>
                </div>

                <div class="card-body p-4 pt-2">
                    {% if mensaje %}
                    <div class="alert alert-info border-0 shadow-sm rounded-3 mb-4 d-flex align-items-center">
                        <i class="fa-solid fa-circle-info me-2 fa-lg"></i>
                        <div>{{ mensaje }}</div>
                    </div>
                    {% endif %}

                    <form method="POST" action="/ventas/nueva">
                        <!-- Cliente -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="clienteInput" name="cliente"
                                placeholder="Nombre" required
                                style="border-radius: 12px; border: 1px solid var(--input-border); background-color: var(--input-bg);">
                            <label for="clienteInput" class="text-muted"><i class="fa-solid fa-user me-2"></i>Nombre del
                                Cliente</label>
                        </div>

                        <!-- Tipo de Café -->
                        <div class="form-floating mb-3">
                            <select class="form-select" id="tipoSelect" name="tipo" required
                                style="border-radius: 12px; border: 1px solid var(--input-border); background-color: var(--input-bg);">
                                <option value="" disabled selected>Seleccionar opción</option>
                                {% for tipo, precio in precios.items() %}
                                <option value="{{ tipo }}">{{ tipo }} - ${{ precio }} MXN</option>
                                {% endfor %}
                            </select>
                            <label for="tipoSelect" class="text-muted"><i class="fa-solid fa-mug-hot me-2"></i>Tipo de
                                Café</label>
                        </div>

                        <!-- Cantidad -->
                        <div class="form-floating mb-4">
                            <input type="number" class="form-control" id="cantidadInput" name="cantidad" min="1"
                                value="1" required
                                style="border-radius: 12px; border: 1px solid var(--input-border); background-color: var(--input-bg);">
                            <label for="cantidadInput" class="text-muted"><i
                                    class="fa-solid fa-hashtag me-2"></i>Cantidad</label>
                        </div>

                        <button class="btn w-100 py-3 fw-bold text-white shadow-sm" type="submit"
                            style="background: linear-gradient(135deg, var(--gold-primary), var(--gold-hover)); border: none; border-radius: 12px; font-size: 1.1rem; transition: transform 0.2s;">
                            <i class="fa-solid fa-check me-2"></i> Confirmar Venta
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
